<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei",sans-serif;background:#f0f4f8;color:#222;min-height:100vh}
header{background:linear-gradient(135deg,#1a3c5e,#2d6a9f);color:#fff;padding:16px 20px;text-align:center}
header h1{font-size:1.4rem;margin-bottom:4px}
header p{font-size:.85rem;opacity:.85}
.tabs{display:flex;background:#1a3c5e;position:sticky;top:0;z-index:100}
.tab{flex:1;padding:12px;text-align:center;cursor:pointer;color:#aac4e0;font-size:.9rem;border-bottom:3px solid transparent;transition:.2s}
.tab.active{color:#fff;border-bottom-color:#4db8ff;background:#2d6a9f}
.scorebar{background:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ddd;position:sticky;top:45px;z-index:99;flex-wrap:wrap}
.scorebar span{font-size:.85rem;color:#555}
.scorebar strong{color:#1a3c5e;font-size:1rem}
.progress-wrap{flex:1;background:#e0e8f0;border-radius:8px;height:8px;min-width:80px}
.progress-bar{height:8px;border-radius:8px;background:linear-gradient(90deg,#2d9e4f,#4db84d);transition:width .3s}
.btn-reset{margin-left:auto;background:#e74c3c;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.8rem}
.btn-reset:hover{background:#c0392b}
.section{display:none;padding:12px}
.section.active{display:block}
.question-card{background:#fff;border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.08);transition:.2s}
.question-card.answered-correct{border-left:4px solid #2ecc71}
.question-card.answered-wrong{border-left:4px solid #e74c3c}
.question-card.answered-partial{border-left:4px solid #f39c12}
.qhead{display:flex;gap:8px;margin-bottom:12px}
.qnum{background:#1a3c5e;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0}
.qtitle{font-size:.92rem;line-height:1.5;font-weight:600}
.multi-badge{background:#f39c12;color:#fff;font-size:.65rem;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.options{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;border:1.5px solid #ddd;transition:.15s;font-size:.88rem;line-height:1.4}
.opt:hover:not(.disabled){background:#eaf2ff;border-color:#4db8ff}
.opt.disabled{cursor:default}
.opt.correct{background:#d5f5e3;border-color:#2ecc71}
.opt.wrong{background:#fde8e8;border-color:#e74c3c}
.opt.missed{background:#fff3cd;border-color:#f39c12}
.opt input[type=radio],.opt input[type=checkbox]{margin-top:2px;flex-shrink:0;accent-color:#1a3c5e}
.opt-label{flex:1}
.opt-key{font-weight:700;color:#1a3c5e;margin-right:4px;flex-shrink:0}
.check-btn{margin-top:10px;background:#1a3c5e;color:#fff;border:none;padding:8px 18px;border-radius:7px;cursor:pointer;font-size:.85rem}
.check-btn:hover{background:#2d6a9f}
.check-btn:disabled{background:#aaa;cursor:default}
.feedback{margin-top:8px;font-size:.83rem;padding:6px 10px;border-radius:6px}
.feedback.correct{background:#d5f5e3;color:#1a7a3c}
.feedback.wrong{background:#fde8e8;color:#922b21}
.feedback.partial{background:#fef9e7;color:#7d6608}
.next-btn{margin-top:12px;background:#2d6a9f;color:#fff;border:none;padding:9px 22px;border-radius:7px;cursor:pointer;font-size:.88rem}
.next-btn:hover{background:#1a3c5e}
.summary-card{background:#fff;border-radius:10px;padding:18px;margin:12px 0;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.summary-card h2{color:#1a3c5e;margin-bottom:8px;font-size:1.1rem}
.summary-card h3{color:#1a3c5e;margin:14px 0 8px;font-size:.95rem}
.all-correct{color:#1a7a3c;font-weight:600;margin-top:10px;font-size:.9rem}
.wrong-item{border-left:4px solid #e74c3c;background:#fdf2f2;border-radius:6px;padding:10px 12px;margin-bottom:10px;font-size:.85rem;line-height:1.5}
.wrong-q{font-weight:600;margin-bottom:6px;color:#222}
.wrong-your{color:#922b21}
.wrong-correct{color:#1a7a3c}
.btn-restart{margin-top:12px;background:#1a3c5e;color:#fff;border:none;padding:9px 22px;border-radius:7px;cursor:pointer;font-size:.88rem}
.btn-restart:hover{background:#2d6a9f}
@media(max-width:480px){.qnum{width:24px;height:24px;font-size:.7rem}.qtitle{font-size:.85rem}.opt{font-size:.82rem}}
</style>

<script>
const hw4=[
{q:"資安健診的主要目的不包括下列哪一項？",o:{A:"找出系統中潛在的安全弱點",B:"評估網路設備與系統配置",C:"完全杜絕所有外部攻擊",D:"提供修補建議以提升整體安全性"},a:["C"]},
{q:"下列哪一項屬於資安健診時需檢查的項目？",o:{A:"系統效能監控",B:"網路惡意活動檢視",C:"使用者行為分析",D:"業務流程改善"},a:["B"]},
{q:"關於 SOC 服務，下列哪一項不屬於其主要工作流程？",o:{A:"監控系統日誌",B:"建立事件通報單",C:"主動攻擊外部威脅",D:"分派事件處理任務"},a:["C"]},
{q:"日誌管理的基本原則中，下列哪項描述最不正確？",o:{A:"異地備份日誌資料",B:"即時監控與分析",C:"完整記錄必要資訊",D:"只在安全事件發生後才進行記錄"},a:["D"]},
{q:"關於原始碼掃描，下列敘述何者正確？",o:{A:"能夠全面檢測業務邏輯漏洞",B:"適用於系統上線後的安全檢查",C:"可在軟體開發階段早期發現安全問題",D:"僅支援單一程式語言分析"},a:["C"]},
{q:"弱點掃描主要目的在於：",o:{A:"自動化檢測已知漏洞",B:"模擬駭客入侵實際攻擊",C:"分析程式碼中的邏輯錯誤",D:"執行社交工程演練"},a:["A"]},
{q:"關於滲透測試的測試類型，下列哪一項正確描述了黑箱測試的特性？",o:{A:"測試者具備完整的系統內部資訊",B:"測試者僅依賴公開資訊進行攻擊",C:"測試者擁有部分內部資訊",D:"測試者與企業內部人員共同協作"},a:["B"]},
{q:"社交工程演練主要在於：",o:{A:"測試系統漏洞",B:"模擬釣魚攻擊以檢驗員工安全意識",C:"分析網路流量異常",D:"測試防火牆效能"},a:["B"]},
{q:"軟體組成分析(SCA)中所產生的 SBOM 主要用於：",o:{A:"列出軟體中的所有程式語法錯誤",B:"詳細記錄軟體中所有第三方元件及其版本資訊",C:"分析網路流量與安全事件",D:"記錄使用者操作歷史"},a:["B"]},
{q:"在 OWASP Top 10 中，哪一項與加密機制失效直接相關？",o:{A:"A01：權限控制失效",B:"A02：加密機制失效",C:"A03：注入式攻擊",D:"A04：不安全設計"},a:["B"]},
{q:"下列關於原始碼掃描與弱點掃描的比較，何者敘述較為正確？",o:{A:"原始碼掃描可以發現所有已知漏洞",B:"弱點掃描主要用於檢測上線後的系統漏洞",C:"兩者皆無法發現硬編碼密碼問題",D:"弱點掃描在開發階段比原始碼掃描更有效"},a:["B"]},
{q:"在日誌管理中，下列哪項措施有助於防止日誌資料遭竄改？",o:{A:"將日誌儲存在本機",B:"傳輸日誌資料時不進行加密",C:"採用異地備份並使用加密傳輸",D:"只保留最近一天的日誌"},a:["C"]},
{q:"以下關於滲透測試常用工具的敘述，哪一項是不正確的？（哪項不是滲透測試工具）",o:{A:"Metasploit",B:"Nmap",C:"SQLmap",D:"Wireshark"},a:["D"]},
{q:"下列哪項措施不關於提升系統安全性的方法？",o:{A:"定期更新軟體與系統",B:"使用預設密碼及管理員帳號",C:"啟用加密通訊",D:"實施多重身份驗證"},a:["B"]},
{q:"針對資安健診案例，若發現因系統版本未更新而導致安全漏洞，正確的改善措施應包括：",o:{A:"升級系統並加強防火牆設定",B:"忽略該弱點，因為無法立即修補",C:"僅進行日誌分析，不做系統更新",D:"只依賴弱點掃描結果，不進行其他檢查"},a:["A"]},
{q:"【複選】下列哪幾種方式是檢測人員執行紅隊演練過程中可能會使用的攻擊手法？",o:{A:"在 DMZ 網頁伺服器找到 RCE 漏洞並取得系統控制權，在內網橫向移動取得 AD 控制權",B:"透過釣魚信件對企業的海外分公司員工進行社交工程，取得員工電腦控制權並讀取電子郵件信箱",C:"移動到企業所在樓層，側錄 Wi-Fi 然後嘗試破解密碼，取得企業 Wi-Fi 的存取方式",D:"註冊成為企業的供應商，利用供應商網站造假，竄改商品金額"},a:["A","B","C"],multi:true},
{q:"為何應以自動化漏洞評估系統(AVAS)作為驗收基礎，而不是根據 OWASP Top 10 作為驗收要件？",o:{A:"OWASP Top 10 僅涵蓋最常見的安全漏洞，而不是所有可能的安全問題",B:"OWASP Top 10 較易於實施且成本更低",C:"AVAS 獲得領導者向象中的指標意義",D:"AVAS 僅針對網站應用程式，而 OWASP Top 10 適用於所有類型的軟體"},a:["A"]},
{q:"【複選】網路安全滲透測試的目標包含網路裝置、作業系統、實體安全、應用程式、管理制度等。下列敘述哪些錯誤？",o:{A:"網路裝置包含所有能夠連接到網路的各種實體，像是路由器、交換機、防火牆、個人電腦等",B:"實體安全主要指的是機房環境、通訊設備等，是資訊安全中最重要的目標",C:"應用程式是管理與控制電腦軟硬體資源的電腦程式",D:"管理制度指的是為了保障網路安全對使用者提出的要求與限制"},a:["B","C"],multi:true},
{q:"關於滲透測試工具的敘述，下列何者正確？",o:{A:"John the Ripper 和 Hashcat，主要用在社交工程",B:"Aircrack-ng 和 Kismet 用在有線網路刺探分析",C:"Nmap 和 Wireshark 用於識別網路中的設備，以及他們開放的端口和服務",D:"OWASP ZAP 和 Burp Suite 用在作業系統漏洞分析"},a:["C"]},
{q:"Metasploit 框架最主要是用於下列何種情境？",o:{A:"防火牆配置",B:"網路封包分析",C:"漏洞利用和測試",D:"垃圾郵件過濾"},a:["C"]},
{q:"有關防止 OWASP Top 10 的 A02:2021-Cryptographic Failures 漏洞之敘述，下列何者錯誤？",o:{A:"確保將所有的機敏資料加密",B:"使用最新版且標準的強加密演算法",C:"使用適當的金鑰管理",D:"使用 HTTP 的協定加密傳輸中的資料"},a:["D"]},
{q:"下列何項行為最容易導致 OWASP Top 10 的 A01:2021-Broken Access Control 漏洞發生？",o:{A:"使用強密碼進行身份驗證",B:"未在頁面上實施權限控制",C:"在密碼重置流程中使用多重身份驗證",D:"定期進行安全漏洞掃描與修復"},a:["B"]},
{q:"關於弱點掃描，下列敘述何者錯誤？",o:{A:"網路弱點掃描用在尋找網路環境中的脆弱點",B:"應用程式弱點掃描主要針對特定應用程式（如 SQL 注入、XSS、敏感目錄外洩等漏洞）",C:"主機弱點掃描用在檢查個別主機的脆弱點，例如主機效能負載對外服務能力，或是識別主機防毒系統是否更新",D:"常見工具有 OWASP ZAP, OpenVAS, Nessus...等"},a:["C"]},
{q:"依據 OWASP Top 10 有關安全配置錯誤風險之敘述，當應用程式處於以下何種狀態時，該應用程式可能容易受到攻擊？",o:{A:"啟用或安裝了必要的功能",B:"預設帳號及密碼仍處於啟用狀態",C:"系統最新的安全功能被啟用",D:"伺服器發送安全標頭或指令"},a:["B"]},
{q:"依據 OWASP Top 10 有關應用程式未驗證或過濾使用者所提供資料而產生風險之敘述，下列何者有誤？",o:{A:"常見的攻擊手法包含 Cross-site Scripting 攻擊",B:"常見的攻擊手法包含 SQL Injection 攻擊",C:"需要將命令與查詢資料合併，以防止注入式攻擊",D:"OWASP Top 10 的 Injection 風險"},a:["C"]},
{q:"下列何項「不」是程式碼開發所使用的原始碼檢測工具(Static Code Analysis SCA)？",o:{A:"Fortify",B:"Checkmarx",C:"Nessus",D:"SonarQube"},a:["C"]},
{q:"關於滲透測試的敘述，下列何者錯誤？",o:{A:"模擬駭客手法，在不需要系統管理者或公司同意下，進行漏洞驗證",B:"模擬駭客手法或惡意使用者的行為，試圖找出和利用系統的弱點",C:"滲透測試要確保不會影響正常的業務運作和資料的完整性",D:"滲透測試(Pen Testing)是一種安全測試方法"},a:["A"]},
{q:"在進行資安健診時，檢測作業最關鍵的活動是下列何項？",o:{A:"更新所有辦公軟體至最新版本",B:"監控社交媒體上員工的活動",C:"評估和識別系統中的潛在安全漏洞",D:"部署最新的防毒軟體"},a:["C"]},
{q:"【複選】關於源碼檢測，下列哪些正確描述了 DLL Side Loading？",o:{A:"DLL Side Loading 涉及到替換正常的 DLL 文件",B:"通常被用來繞過安全措施並執行惡意程式碼",C:"此技術概念僅可以在 Linux 系統上實現",D:"DLL Side Loading 可以利用合法軟體的加載行為來隱藏惡意活動"},a:["A","B","D"],multi:true},
{q:"【複選】關於資安測試工具用途的敘述，下列哪些正確？",o:{A:"Acunetix - Web 漏洞掃描程式",B:"Wireshark - 提供網路協定、封包等資訊",C:"Sqlmap - 用於檢測和利用應用程式 SQL 注入及對資料庫的攻擊",D:"Canvas - 社交攻擊用工具"},a:["A","C"],multi:true},
{q:"有關 OWASP Top 10 之敘述，下列何者正確？",o:{A:"為網路安全的法律規範",B:"為網路攻擊的報告",C:"為 ISO 發布的網路安全標準",D:"為網路應用程式漏洞的指南"},a:["D"]},
{q:"有關 OWASP Top 10 A03:2021-Injection 漏洞之敘述，下列何者錯誤？",o:{A:"將命令與查詢資料分開防止注入攻擊漏洞的發生",B:"使用安全的應用程式界面(API)防止注入攻擊漏洞的發生",C:"應用程式相互驗證時容易發生",D:"使用正向表列或白名單可有效避免此注入攻擊"},a:["C"]},
{q:"下列何項 nmap 指令可以跳過 ping 功能直接開始掃 port？",o:{A:"-sL",B:"-Pn",C:"-p-",D:"-sn"},a:["B"]},
{q:"關於滲透測試(Penetration Test)的敘述，下列何者錯誤？",o:{A:"滲透測試的工作由一群對網路及系統安全有完整知識與豐富經驗的成員組成，為確保組織資訊安全，不可能委託由第三方負責",B:"滲透測試是藉由對企業網路採取各種攻擊的手段以便找出系統可能存在的漏洞",C:"雙黑箱滲透測試主要對內部人員保密下進行",D:"滲透測試主要考驗系統的安全防護能力"},a:["A"]},
{q:"網站應用程式伺服器允許顯示錯誤訊息(如 Stack traces)給使用者，關於此應用程式缺陷的描述，下列何者較正確？",o:{A:"跨站請求偽造(Cross-Site Request Forgery)",B:"安全設定錯誤(Security Misconfiguration)",C:"認證和驗證失效(Identification and Authentication Failures)",D:"伺服器端請求偽造(Server-Side Request Forgery)"},a:["B"]},
{q:"關於應用程式軟體與資料完整性的敘述，下列何者錯誤？",o:{A:"使用數位簽章(Digital Signature)來驗證軟體未被竄改",B:"僅於信任的儲存庫(Repository)取得應用程式套件",C:"整合測試流程(CI/CD)應適當隔離與存取控制以確保安全",D:"源碼掃描可有效檢查是否遭植入惡意程式碼（如：後門程式）"},a:["D"]},
{q:"與滲透測試及弱點掃描相關議題的敘述，下列何者較為正確？",o:{A:"若使用滲透測試工具來測試系統安全性，測試期間宜謹慎規劃不要危及系統運作",B:"滲透測試會影響系統可用性之稽核測試，宜於正常營運時間執行。可確認實際結果",C:"ISO 27005 為提供關於技術遵循性審查之特定國際指引",D:"滲透測試或源碼檢測之結果，若有風險需判斷修補，可於下次再檢測時，確認實施結果"},a:["A"]},

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const labels=['A','B','C','D'];

function getCorrectDks(item,ans){
  return ans.map(ok=>Object.entries(item.optMap).find(([,v])=>v===ok)[0]).sort();
}

function newSectionState(qs){
  return{order:shuffle([...Array(qs.length).keys()]),idx:0,done:0,correct:0,wrong:[],curItem:null};
}

let state={cur:0,sections:[newSectionState(hw4),newSectionState(hw5)]};

function init(){
  renderQuestion(0);
  renderQuestion(1);
  updateScore(0);
}

function buildItem(q){
  const shuffledKeys=shuffle(Object.keys(q.o));
  const optMap={},dispOpts={};
  shuffledKeys.forEach((ok,di)=>{const dk=labels[di];optMap[dk]=ok;dispOpts[dk]=q.o[ok];});
  return{optMap,dispOpts,multi:!!q.multi,answered:false};
}

function renderQuestion(si){
  const qs=si===0?hw4:hw5;
  const st=state.sections[si];
  const origIdx=st.order[st.idx];
  const q=qs[origIdx];
  const item=buildItem(q);
  item.origIdx=origIdx;
  st.curItem=item;
  const dks=Object.keys(item.dispOpts);
  const opts=dks.map(dk=>{
    const inp=item.multi
      ?`<input type="checkbox" name="cur${si}" value="${dk}" id="opt_${si}_${dk}">`
      :`<input type="radio" name="cur${si}" value="${dk}" id="opt_${si}_${dk}">`;
    return`<label class="opt" id="optlbl_${si}_${dk}" for="opt_${si}_${dk}"><span class="opt-key">${dk}.</span><span class="opt-label">${item.dispOpts[dk]}</span>${inp}</label>`;
  }).join('');
  const multiBadge=item.multi?`<span class="multi-badge">複選</span>`:'';
  const el=document.getElementById(`quiz${si}`);
  el.innerHTML=`
    <div class="question-card" id="qcard${si}">
      <div class="qhead"><div class="qnum">${st.idx+1}</div><div class="qtitle">${q.q}${multiBadge}</div></div>
      <div class="options" id="qopts${si}">${opts}</div>
      ${item.multi?`<button class="check-btn" id="checkBtn${si}" onclick="checkMulti(${si})">確認答案</button>`:''}
      <div class="feedback" id="qfb${si}" style="display:none"></div>
      <button class="next-btn" id="nextBtn${si}" style="display:none" onclick="nextQuestion(${si})"></button>
    </div>`;
  if(!item.multi){
    dks.forEach(dk=>{
      document.getElementById(`opt_${si}_${dk}`).addEventListener('change',()=>checkSingle(si,dk));
    });
  }
  updateScore(si);
}

function recordResult(si,item,q,correct,chosenDks){
  const st=state.sections[si];
  st.done++;
  if(correct){st.correct++;return}
  const correctDks=getCorrectDks(item,q.a);
  st.wrong.push({
    qtext:q.q,
    multi:item.multi,
    yourAnswer:chosenDks.length?chosenDks.map(dk=>dk+'. '+item.dispOpts[dk]).join('、'):'（未作答）',
    correctAnswer:correctDks.map(dk=>dk+'. '+item.dispOpts[dk]).join('、')
  });
}

function showNextButton(si){
  const st=state.sections[si];
  const btn=document.getElementById(`nextBtn${si}`);
  btn.style.display='inline-block';
  btn.textContent=(st.idx===st.order.length-1)?'查看結果':'下一題';
}

function checkSingle(si,chosenDk){
  const item=state.sections[si].curItem;
  if(item.answered) return;
  item.answered=true;
  const qs=si===0?hw4:hw5;
  const q=qs[item.origIdx];
  const correct=q.a[0]===item.optMap[chosenDk];
  const correctDk=getCorrectDks(item,q.a)[0];
  Object.keys(item.dispOpts).forEach(dk=>{
    const lbl=document.getElementById(`optlbl_${si}_${dk}`);
    const inp=document.getElementById(`opt_${si}_${dk}`);
    lbl.classList.add('disabled'); inp.disabled=true;
    if(dk===correctDk) lbl.classList.add('correct');
    else if(dk===chosenDk&&!correct) lbl.classList.add('wrong');
  });
  const card=document.getElementById(`qcard${si}`);
  card.classList.add(correct?'answered-correct':'answered-wrong');
  const fb=document.getElementById(`qfb${si}`);
  fb.style.display='block';
  fb.className=`feedback ${correct?'correct':'wrong'}`;
  fb.textContent=correct?'✓ 正確！':'✗ 錯誤！正確答案：'+correctDk+'（'+item.dispOpts[correctDk]+'）';
  recordResult(si,item,q,correct,[chosenDk]);
  updateScore(si);
  showNextButton(si);
}

function checkMulti(si){
  const item=state.sections[si].curItem;
  if(item.answered) return;
  const dks=Object.keys(item.dispOpts);
  const chosenDks=dks.filter(dk=>document.getElementById(`opt_${si}_${dk}`).checked).sort();
  if(chosenDks.length===0) return;
  item.answered=true;
  const qs=si===0?hw4:hw5;
  const q=qs[item.origIdx];
  const correctDks=getCorrectDks(item,q.a);
  const chosenOks=chosenDks.map(dk=>item.optMap[dk]).sort();
  const correct=JSON.stringify(chosenOks)===JSON.stringify([...q.a].sort());
  const missed=correctDks.filter(dk=>!chosenDks.includes(dk));
  dks.forEach(dk=>{
    const lbl=document.getElementById(`optlbl_${si}_${dk}`);
    const inp=document.getElementById(`opt_${si}_${dk}`);
    inp.disabled=true; lbl.classList.add('disabled');
    if(correctDks.includes(dk)&&chosenDks.includes(dk)) lbl.classList.add('correct');
    else if(chosenDks.includes(dk)&&!correctDks.includes(dk)) lbl.classList.add('wrong');
    else if(correctDks.includes(dk)&&!chosenDks.includes(dk)) lbl.classList.add('missed');
  });
  const btn=document.getElementById(`checkBtn${si}`);
  if(btn) btn.disabled=true;
  const card=document.getElementById(`qcard${si}`);
  card.classList.add(correct?'answered-correct':(missed.length>0?'answered-partial':'answered-wrong'));
  const fb=document.getElementById(`qfb${si}`);
  fb.style.display='block';
  if(correct){
    fb.className='feedback correct';
    fb.textContent='✓ 正確！';
  } else {
    fb.className='feedback wrong';
    fb.textContent='✗ 正確答案：'+correctDks.join('、')+`（${correctDks.map(dk=>dk+'='+item.dispOpts[dk]).join('；')}）`;
  }
  recordResult(si,item,q,correct,chosenDks);
  updateScore(si);
  showNextButton(si);
}

function nextQuestion(si){
  const st=state.sections[si];
  st.idx++;
  if(st.idx>=st.order.length){
    showSummary(si);
  } else {
    renderQuestion(si);
  }
  window.scrollTo(0,0);
}

function showSummary(si){
  const st=state.sections[si];
  document.getElementById(`quiz${si}`).style.display='none';
  const sum=document.getElementById(`summary${si}`);
  const pct=st.done?Math.round(st.correct/st.done*100):0;
  let html=`<div class="summary-card">
    <h2>測驗結束！</h2>
    <p>得分：${st.correct} / ${st.done}（答對率 ${pct}%）</p>`;
  if(st.wrong.length===0){
    html+=`<p class="all-correct">🎉 全部答對，太強了！</p>`;
  } else {
    html+=`<h3>錯題統整（共 ${st.wrong.length} 題）</h3>`;
    html+=st.wrong.map((w,i)=>`
      <div class="wrong-item">
        <div class="wrong-q">${i+1}. ${w.qtext}${w.multi?'<span class="multi-badge">複選</span>':''}</div>
        <div class="wrong-your">你的答案：${w.yourAnswer}</div>
        <div class="wrong-correct">正確答案：${w.correctAnswer}</div>
      </div>`).join('');
  }
  html+=`<button class="btn-restart" onclick="resetSection(${si})">重新測驗本回合</button></div>`;
  sum.innerHTML=html;
  sum.style.display='block';
  updateScore(si);
}

function resetSection(si){
  const qs=si===0?hw4:hw5;
  state.sections[si]=newSectionState(qs);
  document.getElementById(`quiz${si}`).style.display='block';
  const sum=document.getElementById(`summary${si}`);
  sum.style.display='none';
  sum.innerHTML='';
  renderQuestion(si);
  window.scrollTo(0,0);
}

function resetCurrent(){
  resetSection(state.cur);
}

function switchTab(idx){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  document.querySelectorAll('.section').forEach((s,i)=>s.classList.toggle('active',i===idx));
  state.cur=idx;
  updateScore(idx);
}

function updateScore(si){
  if(si!==state.cur) return;
  const st=state.sections[si];
  const total=st.order.length;
  document.getElementById('score-display').textContent=`${st.correct} / ${st.done}`;
  document.getElementById('pct-display').textContent=st.done?`答對率 ${Math.round(st.correct/st.done*100)}%`:'答對率 0%';
  document.getElementById('pbar').style.width=`${Math.round(st.done/total*100)}%`;
  document.getElementById('qcounter').textContent=Math.min(st.idx+1,total);
  document.getElementById('qtotal').textContent=total;
}

init();
</script>
</body>
</html>
