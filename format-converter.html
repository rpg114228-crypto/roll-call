<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>格式轉換器</title>
  <style>
    :root {
      --base: #1e1e2e; --mantle: #181825; --surface0: #313244;
      --surface1: #45475a; --surface2: #585b70;
      --text: #cdd6f4; --subtext: #a6adc8;
      --blue: #89b4fa; --green: #a6e3a1; --red: #f38ba8; --yellow: #f9e2af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--base); color: var(--text);
      font-family: '微軟正黑體','Microsoft JhengHei',-apple-system,sans-serif;
      min-height: 100vh; max-width: 640px; margin: 0 auto; padding-bottom: 32px;
    }
    header {
      background: var(--mantle); padding: 14px 18px;
      border-bottom: 1px solid var(--surface0);
      position: sticky; top: 0; z-index: 100;
    }
    header h1 { font-size: 17px; color: var(--blue); }
    .tabs {
      display: flex; background: var(--mantle);
      border-bottom: 1px solid var(--surface0);
      overflow-x: auto; scrollbar-width: none;
      position: sticky; top: 49px; z-index: 99;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 1; min-width: 75px; padding: 11px 6px;
      background: none; border: none; color: var(--subtext);
      font-family: inherit; font-size: 13px; cursor: pointer;
      border-bottom: 2px solid transparent; white-space: nowrap; transition: all .2s;
    }
    .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
    .tab-content { display: none; padding: 14px; }
    .tab-content.active { display: block; }
    .card { background: var(--surface0); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .card-title { color: var(--blue); font-weight: bold; font-size: 14px; margin-bottom: 12px; }
    .drop-zone {
      border: 2px dashed var(--surface2); border-radius: 10px; padding: 22px;
      text-align: center; cursor: pointer; transition: all .2s; margin-bottom: 12px;
    }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--blue); background: var(--surface1); }
    .drop-zone input[type=file] { display: none; }
    .drop-icon { font-size: 28px; margin-bottom: 6px; }
    .drop-hint { color: var(--subtext); font-size: 13px; }
    .drop-name { color: var(--green); font-size: 13px; margin-top: 6px; word-break: break-all; }
    .form-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .form-label { color: var(--subtext); font-size: 13px; min-width: 68px; flex-shrink: 0; }
    select {
      background: var(--surface1); border: none; border-radius: 8px;
      padding: 8px 10px; color: var(--text); font-family: inherit; font-size: 13px; outline: none;
    }
    .format-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 12px; }
    .fmt-chip {
      background: var(--surface1); border: 2px solid transparent; border-radius: 8px;
      padding: 8px 4px; text-align: center; font-size: 13px; cursor: pointer; transition: all .2s;
    }
    .fmt-chip.on { border-color: var(--blue); color: var(--blue); }
    .quality-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    input[type=range] { accent-color: var(--blue); flex: 1; }
    .q-val { color: var(--blue); font-weight: bold; min-width: 28px; text-align: right; }
    .btn {
      border: none; border-radius: 10px; padding: 12px 20px; font-family: inherit;
      font-size: 15px; font-weight: bold; cursor: pointer; transition: all .2s; width: 100%;
    }
    .btn-p { background: var(--blue); color: var(--base); }
    .btn-p:hover { opacity: .9; }
    .btn-p:active { transform: scale(.98); }
    .btn-p:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .btn-s { background: var(--surface1); color: var(--text); }
    .btn-sm { padding: 7px 14px; font-size: 13px; width: auto; border-radius: 8px; }
    .status { text-align: center; padding: 7px; font-size: 13px; color: var(--green); min-height: 30px; }
    .status.err { color: var(--red); }
    .status.busy { color: var(--yellow); }
    textarea {
      width: 100%; background: var(--surface1); border: none; border-radius: 8px;
      padding: 10px; color: var(--text); font-family: Consolas,monospace; font-size: 13px;
      outline: none; resize: vertical; margin-top: 8px;
    }
    #wordPreview { background: #fff; color: #000; padding: 14px; border-radius: 8px; font-size: 14px; max-height: 380px; overflow: auto; margin-top: 8px; }
    .note { color: var(--subtext); font-size: 12px; margin-top: 6px; line-height: 1.5; }
  </style>
</head>
<body>

<header><h1>⚙️ 格式轉換器</h1></header>

<div class="tabs">
  <button class="tab-btn active" data-tab="img">🖼 圖片</button>
  <button class="tab-btn" data-tab="csv">📊 CSV/JSON</button>
  <button class="tab-btn" data-tab="enc">📝 編碼</button>
  <button class="tab-btn" data-tab="doc">📄 Word/PDF</button>
</div>

<!-- ── 圖片轉換 ─────────────────────────────────────── -->
<div id="tab-img" class="tab-content active">
  <div class="card">
    <div class="card-title">圖片格式轉換</div>
    <div class="drop-zone" id="dz-img">
      <input type="file" id="f-img" accept="image/*">
      <div class="drop-icon">🖼️</div>
      <div class="drop-hint">點擊或拖曳圖片</div>
      <div class="drop-name" id="n-img"></div>
    </div>
    <div class="card-title" style="margin-top:2px">輸出格式</div>
    <div class="format-grid">
      <div class="fmt-chip on" data-fmt="PNG">PNG</div>
      <div class="fmt-chip" data-fmt="JPEG">JPG</div>
      <div class="fmt-chip" data-fmt="WEBP">WEBP</div>
      <div class="fmt-chip" data-fmt="BMP">BMP</div>
    </div>
    <div id="q-row" class="quality-row" style="display:none">
      <span class="form-label">品質</span>
      <input type="range" id="q-slider" min="1" max="100" value="90" oninput="document.getElementById('q-val').textContent=this.value">
      <span class="q-val" id="q-val">90</span>
    </div>
    <button class="btn btn-p" id="btn-img" disabled onclick="convertImage()">開始轉換</button>
    <div class="status" id="st-img"></div>
  </div>
</div>

<!-- ── CSV ↔ JSON ─────────────────────────────────────── -->
<div id="tab-csv" class="tab-content">
  <div class="card">
    <div class="card-title">CSV → JSON</div>
    <div class="drop-zone" id="dz-csv">
      <input type="file" id="f-csv" accept=".csv,.txt">
      <div class="drop-icon">📋</div>
      <div class="drop-hint">點擊或拖曳 .csv 檔案</div>
      <div class="drop-name" id="n-csv"></div>
    </div>
    <button class="btn btn-p" id="btn-csv" disabled onclick="csvToJson()">CSV → JSON</button>
    <div class="status" id="st-csv"></div>
  </div>
  <div class="card">
    <div class="card-title">JSON → CSV</div>
    <div class="drop-zone" id="dz-json">
      <input type="file" id="f-json" accept=".json">
      <div class="drop-icon">{ }</div>
      <div class="drop-hint">點擊或拖曳 .json 檔案</div>
      <div class="drop-name" id="n-json"></div>
    </div>
    <button class="btn btn-p" id="btn-json" disabled onclick="jsonToCsv()">JSON → CSV</button>
    <div class="status" id="st-json"></div>
  </div>
</div>

<!-- ── 文字編碼 ─────────────────────────────────────── -->
<div id="tab-enc" class="tab-content">
  <div class="card">
    <div class="card-title">文字編碼轉換</div>
    <div class="drop-zone" id="dz-enc">
      <input type="file" id="f-enc" accept=".txt,.csv,.json,.xml,.html,.md">
      <div class="drop-icon">📄</div>
      <div class="drop-hint">點擊或拖曳文字檔</div>
      <div class="drop-name" id="n-enc"></div>
    </div>
    <div class="form-row">
      <span class="form-label">來源編碼</span>
      <select id="src-enc">
        <option value="auto">自動偵測</option>
        <option value="utf-8">UTF-8</option>
        <option value="big5">BIG5</option>
        <option value="gbk">GBK</option>
        <option value="shift-jis">Shift-JIS</option>
        <option value="iso-8859-1">Latin-1</option>
        <option value="utf-16le">UTF-16 LE</option>
      </select>
    </div>
    <div class="form-row">
      <span class="form-label">目標編碼</span>
      <select id="dst-enc">
        <option value="utf-8">UTF-8</option>
        <option value="utf-8-bom">UTF-8 + BOM</option>
      </select>
    </div>
    <p class="note" style="margin-bottom:10px">* 瀏覽器限制：輸出僅支援 UTF-8 / UTF-8+BOM</p>
    <button class="btn btn-p" id="btn-enc" disabled onclick="convertEncoding()">開始轉換</button>
    <div class="status" id="st-enc"></div>
  </div>
</div>

<!-- ── Word / PDF ─────────────────────────────────────── -->
<div id="tab-doc" class="tab-content">
  <div class="card">
    <div class="card-title">Word (.docx) → 預覽 / 列印為 PDF</div>
    <div class="drop-zone" id="dz-word">
      <input type="file" id="f-word" accept=".docx">
      <div class="drop-icon">📝</div>
      <div class="drop-hint">點擊或拖曳 .docx 檔案</div>
      <div class="drop-name" id="n-word"></div>
    </div>
    <button class="btn btn-p" id="btn-word" disabled onclick="wordToHtml()">轉換並預覽</button>
    <div class="status" id="st-word"></div>
    <div id="word-result" style="display:none">
      <button class="btn btn-s" style="margin-top:8px" onclick="printDoc()">🖨️ 列印 / 儲存為 PDF</button>
      <div id="wordPreview"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">PDF 解鎖 / 文字擷取</div>
    <div class="drop-zone" id="dz-pdf">
      <input type="file" id="f-pdf" accept=".pdf">
      <div class="drop-icon">📕</div>
      <div class="drop-hint">點擊或拖曳 .pdf 檔案（可上鎖）</div>
      <div class="drop-name" id="n-pdf"></div>
    </div>
    <div class="form-row">
      <span class="form-label">PDF 密碼</span>
      <input type="password" id="pdf-pwd" placeholder="無密碼則留空" style="flex:1;background:var(--surface1);border:none;border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;outline:none;">
    </div>
    <div style="display:flex;gap:8px;margin-bottom:4px">
      <button class="btn btn-p" id="btn-pdf" disabled onclick="extractPdf()" style="flex:1">擷取文字</button>
      <button class="btn btn-s" id="btn-unlock" disabled onclick="unlockPdf()" style="flex:1">🔓 儲存無密碼 PDF</button>
    </div>
    <div class="status" id="st-pdf"></div>
    <textarea id="pdf-text" rows="8" placeholder="擷取的文字會顯示在這裡…" style="display:none"></textarea>
    <button id="btn-copy-pdf" class="btn btn-s btn-sm" style="display:none;margin-top:8px" onclick="copyPdf()">複製文字</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
// ── Tabs ──────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ── Drop zones ────────────────────────────────────────────────
const fileMap = {};

document.querySelectorAll('.drop-zone').forEach(dz => {
  const input = dz.querySelector('input[type=file]');
  const nameEl = dz.querySelector('.drop-name');
  const btnId = 'btn-' + dz.id.replace('dz-','');

  dz.addEventListener('click', () => input.click());
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('dragover');
    const f = e.dataTransfer.files[0]; if (!f) return;
    const dt = new DataTransfer(); dt.items.add(f); input.files = dt.files;
    input.dispatchEvent(new Event('change'));
  });
  input.addEventListener('change', () => {
    const f = input.files[0]; if (!f) return;
    fileMap[input.id] = f;
    nameEl.textContent = f.name;
    document.getElementById(btnId).disabled = false;
    if (input.id === 'f-pdf') document.getElementById('btn-unlock').disabled = false;
  });
});

// ── Format chips ──────────────────────────────────────────────
let imgFmt = 'PNG';
document.querySelectorAll('.fmt-chip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.fmt-chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on');
    imgFmt = c.dataset.fmt;
    document.getElementById('q-row').style.display = (imgFmt==='JPEG'||imgFmt==='WEBP') ? 'flex' : 'none';
  });
});

// ── Status ────────────────────────────────────────────────────
function st(id, msg, cls='') {
  const el = document.getElementById('st-'+id);
  el.textContent = msg; el.className = 'status ' + cls;
}

// ── Image ─────────────────────────────────────────────────────
function convertImage() {
  const file = fileMap['f-img']; if (!file) return;
  st('img','轉換中…','busy');
  document.getElementById('btn-img').disabled = true;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const ctx = c.getContext('2d');
      if (imgFmt === 'JPEG') { ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); }
      ctx.drawImage(img, 0, 0);
      const mime = {PNG:'image/png',JPEG:'image/jpeg',WEBP:'image/webp',BMP:'image/bmp'}[imgFmt]||'image/png';
      const ext = imgFmt==='JPEG'?'jpg':imgFmt.toLowerCase();
      const q = parseInt(document.getElementById('q-slider').value)/100;
      c.toBlob(blob => {
        download(URL.createObjectURL(blob), file.name.replace(/\.[^.]+$/,'')+'.'+ext);
        st('img',`✓ 完成 (${(blob.size/1024).toFixed(1)} KB)`);
        document.getElementById('btn-img').disabled = false;
      }, mime, q);
    };
    img.onerror = () => { st('img','✗ 無法讀取圖片','err'); document.getElementById('btn-img').disabled=false; };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ── CSV → JSON ────────────────────────────────────────────────
function csvToJson() {
  const file = fileMap['f-csv']; if (!file) return;
  st('csv','轉換中…','busy'); document.getElementById('btn-csv').disabled=true;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const lines = e.target.result.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(l=>l.trim());
      if (lines.length < 2) throw new Error('需要標題行 + 至少一筆資料');
      const headers = parseCsv(lines[0]);
      const data = lines.slice(1).map(l => {
        const v = parseCsv(l); const o={};
        headers.forEach((h,i) => o[h] = v[i]??''); return o;
      });
      const json = JSON.stringify(data, null, 2);
      downloadText(json, file.name.replace(/\.csv$/i,'.json'), 'application/json');
      st('csv',`✓ 完成，共 ${data.length} 筆`);
    } catch(err) { st('csv','✗ '+err.message,'err'); }
    document.getElementById('btn-csv').disabled=false;
  };
  reader.readAsText(file,'utf-8');
}

// ── JSON → CSV ────────────────────────────────────────────────
function jsonToCsv() {
  const file = fileMap['f-json']; if (!file) return;
  st('json','轉換中…','busy'); document.getElementById('btn-json').disabled=true;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      let data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) data = [data];
      if (!data.length) throw new Error('JSON 陣列為空');
      const allKeys = [...new Set(data.flatMap(r => Object.keys(r)))];
      const esc = v => { const s=String(v??''); return (s.includes(',')||s.includes('"')||s.includes('\n'))?`"${s.replace(/"/g,'""')}"`:s; };
      const csv = [allKeys.map(esc).join(','), ...data.map(r => allKeys.map(k => esc(r[k]??'')).join(','))].join('\n');
      downloadText('﻿'+csv, file.name.replace(/\.json$/i,'.csv'), 'text/csv');
      st('json',`✓ 完成，共 ${data.length} 筆`);
    } catch(err) { st('json','✗ '+err.message,'err'); }
    document.getElementById('btn-json').disabled=false;
  };
  reader.readAsText(file,'utf-8');
}

function parseCsv(line) {
  const res=[]; let cur='', inQ=false;
  for (let i=0;i<line.length;i++) {
    const c=line[i];
    if (inQ) { if(c==='"'&&line[i+1]==='"'){cur+='"';i++;}else if(c==='"')inQ=false;else cur+=c; }
    else { if(c==='"')inQ=true; else if(c===','){res.push(cur.trim());cur='';} else cur+=c; }
  }
  res.push(cur.trim()); return res;
}

// ── Encoding ──────────────────────────────────────────────────
function convertEncoding() {
  const file = fileMap['f-enc']; if (!file) return;
  st('enc','轉換中…','busy'); document.getElementById('btn-enc').disabled=true;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const raw = new Uint8Array(e.target.result);
      let enc = document.getElementById('src-enc').value;
      if (enc === 'auto') enc = detectEnc(raw);
      let text;
      try { text = new TextDecoder(enc, {fatal:true}).decode(raw); }
      catch { text = new TextDecoder('utf-8',{fatal:false}).decode(raw); }
      const dst = document.getElementById('dst-enc').value;
      const out = dst==='utf-8-bom' ? '﻿'+text : text;
      downloadText(out, file.name, 'text/plain');
      st('enc',`✓ 完成（${enc} → ${dst}）`);
    } catch(err) { st('enc','✗ '+err.message,'err'); }
    document.getElementById('btn-enc').disabled=false;
  };
  reader.readAsArrayBuffer(file);
}

function detectEnc(b) {
  if (b[0]===0xEF&&b[1]===0xBB&&b[2]===0xBF) return 'utf-8';
  if (b[0]===0xFF&&b[1]===0xFE) return 'utf-16le';
  if (b[0]===0xFE&&b[1]===0xFF) return 'utf-16be';
  try { new TextDecoder('utf-8',{fatal:true}).decode(b); return 'utf-8'; } catch {}
  return 'big5';
}

// ── Word → HTML ───────────────────────────────────────────────
async function wordToHtml() {
  const file = fileMap['f-word']; if (!file) return;
  st('word','轉換中…','busy'); document.getElementById('btn-word').disabled=true;
  try {
    const buf = await file.arrayBuffer();
    const res = await mammoth.convertToHtml({arrayBuffer: buf});
    document.getElementById('wordPreview').innerHTML = res.value;
    document.getElementById('word-result').style.display = 'block';
    st('word','✓ 完成，可列印為 PDF');
  } catch(err) { st('word','✗ '+err.message,'err'); }
  document.getElementById('btn-word').disabled=false;
}

function printDoc() {
  const c = document.getElementById('wordPreview').innerHTML;
  const w = window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <style>body{font-family:serif;margin:2cm;line-height:1.6}img{max-width:100%}
    @media print{body{margin:0}}</style></head><body>${c}</body></html>`);
  w.document.close(); w.print();
}

// ── PDF helpers ───────────────────────────────────────────────
function getPdfParams() {
  const pwd = document.getElementById('pdf-pwd').value;
  const params = { data: null };
  if (pwd) params.password = pwd;
  return params;
}

async function loadPdfJs(buf) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const params = { data: new Uint8Array(buf) };
  const pwd = document.getElementById('pdf-pwd').value;
  if (pwd) params.password = pwd;
  return pdfjsLib.getDocument(params).promise;
}

// ── PDF text extract ──────────────────────────────────────────
async function extractPdf() {
  const file = fileMap['f-pdf']; if (!file) return;
  st('pdf','讀取 PDF…','busy'); document.getElementById('btn-pdf').disabled=true;
  try {
    const pdf = await loadPdfJs(await file.arrayBuffer());
    let txt = '';
    for (let i=1; i<=pdf.numPages; i++) {
      st('pdf',`讀取第 ${i}/${pdf.numPages} 頁…`,'busy');
      const pg = await pdf.getPage(i);
      const ct = await pg.getTextContent();
      txt += ct.items.map(x=>x.str).join(' ') + '\n\n';
    }
    document.getElementById('pdf-text').value = txt.trim();
    document.getElementById('pdf-text').style.display = 'block';
    document.getElementById('btn-copy-pdf').style.display = 'inline-block';
    st('pdf',`✓ ${pdf.numPages} 頁，${txt.length} 字元`);
  } catch(err) {
    const msg = err.message||String(err);
    st('pdf', msg.includes('password')||msg.includes('密碼') ? '✗ 密碼錯誤或需要密碼' : '✗ '+msg, 'err');
  }
  document.getElementById('btn-pdf').disabled=false;
}

// ── PDF unlock (remove password) ─────────────────────────────
async function unlockPdf() {
  const file = fileMap['f-pdf']; if (!file) return;
  st('pdf','解鎖中…','busy'); document.getElementById('btn-unlock').disabled=true;
  try {
    const buf = await file.arrayBuffer();
    const pwd = document.getElementById('pdf-pwd').value;
    const pdfDoc = await PDFLib.PDFDocument.load(buf, pwd ? { password: pwd } : {});
    const unlocked = await pdfDoc.save();
    download(URL.createObjectURL(new Blob([unlocked],{type:'application/pdf'})),
             file.name.replace(/\.pdf$/i,'_unlocked.pdf'));
    st('pdf','✓ 已儲存無密碼 PDF');
  } catch(err) {
    const msg = err.message||String(err);
    st('pdf', msg.includes('password')||msg.includes('encrypt') ? '✗ 密碼錯誤或需要密碼' : '✗ '+msg, 'err');
  }
  document.getElementById('btn-unlock').disabled=false;
}

function copyPdf() {
  navigator.clipboard.writeText(document.getElementById('pdf-text').value).then(() => {
    const b = document.getElementById('btn-copy-pdf');
    b.textContent='已複製！'; setTimeout(()=>b.textContent='複製文字',2000);
  });
}

// ── Helpers ───────────────────────────────────────────────────
function download(url, name) {
  const a = document.createElement('a'); a.href=url; a.download=name; a.click();
  URL.revokeObjectURL(url);
}
function downloadText(content, name, mime) {
  download(URL.createObjectURL(new Blob([content],{type:mime+';charset=utf-8'})), name);
}
</script>
